services:
  - type: web
    name: pain-diary
    runtime: node
    buildCommand: npm install && npm rebuild better-sqlite3 && npm run build
    startCommand: NODE_ENV=production node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: pain-diary-data
      mountPath: /var/data
      sizeGB: 1
